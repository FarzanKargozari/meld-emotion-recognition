name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,serve]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build the service image
        run: docker build -t meld-emotion .
