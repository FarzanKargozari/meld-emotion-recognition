[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meld-emotion"
version = "1.0.0"
description = "Context-aware emotion recognition in conversation on MELD, with reproducible evaluation and a small inference service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "numpy==1.26.4",
    "scikit-learn==1.9.1",
    "torch==2.10.0",
    "transformers==5.22.1",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
analysis = ["matplotlib==3.11.2"]
baselines = ["sentence-transformers==6.2.0"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "httpx>=0.27,<1"]

[project.scripts]
meld-train = "meld_emotion.train:main"
meld-compare = "meld_emotion.compare:main"
meld-evaluate = "meld_emotion.evaluate:main"
meld-predict = "meld_emotion.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["experiments/baselines"]

[tool.ruff.lint.per-file-ignores]
"scripts/dashboard.py" = ["E501"]  # The page is one embedded HTML string.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
